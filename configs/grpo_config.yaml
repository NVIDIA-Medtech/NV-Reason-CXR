# ENV vars
env:
    WANDB_PROJECT : nv-reason-cxr
    TOKENIZERS_PARALLELISM: false
    PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True,max_split_size_mb:2048"
    VLLM_DISABLE_COMPILE_CACHE: 1

# Data training arguments
dataset_name: nv-reason-cxr-data
dataset_path: grpo.jsonl
dataset_root: datalists/
image_dir: images/
dataset_streaming: false


##########################################################################
# Model arguments
##########################################################################

model_name_or_path: nvidia/NV-Reason-CXR-3B
model_revision: main
torch_dtype: bfloat16
trust_remote_code: false
attn_implementation: flash_attention_2

############################################
# GRPO trainer config

reward_funcs: ["accuracy_reward_hard", "soft_overshort_punishment"]
# reward_weights: [1.0, 1.0]

loss_type: grpo
scale_rewards:  group
temperature: 1
mask_truncated_completions: true
use_liger_loss: false

use_vllm: true
vllm_mode: colocate
vllm_gpu_memory_utilization: 0.3

max_prompt_length: null
max_completion_length: 1800

num_generations: 16
per_device_train_batch_size: 16
gradient_accumulation_steps: 8
per_device_eval_batch_size: 1
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false


output_dir: data/tmp
overwrite_output_dir: true
num_train_epochs: 1

optim: adamw_torch_fused
learning_rate: 1.0e-06
lr_scheduler_type: cosine_with_min_lr
lr_scheduler_kwargs:
  min_lr_rate: 0.05


warmup_steps: 5
max_grad_norm: 0.2

eval_steps: 100
do_eval: false
eval_strategy: "no"

save_steps: 100
save_total_limit: 3
metric_for_best_model: eval_loss
greater_is_better: false


bf16: true
tf32: true
ddp_find_unused_parameters: false
push_to_hub: false

seed: 123

# run_name: wandb_run_name #defaults to output folder
report_to: wandb

log_level: info
logging_steps: 1
logging_strategy: steps
logging_first_step: true

remove_unused_columns: false #VLM specific
dataloader_num_workers: 4
